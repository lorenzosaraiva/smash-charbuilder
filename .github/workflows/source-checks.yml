name: Character Lab source checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ssb-decomp-re
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Check generated donor data is reproducible
        run: |
          mkdir -p build
          python3 tools/generateCustomMoves.py
          python3 tools/generateCustomAnimations.py
          python3 tools/generateCustomCollisions.py
          python3 tools/generateNeutralProjectiles.py
          python3 tools/generateNeutralActions.py
          python3 tools/generateSpecialTiming.py
          git diff --exit-code -- src/ft/ftcustommoves.generated.inc \
            src/ft/ftcustomanimations.generated.inc src/ft/ftcustomanimationshared.generated.inc \
            src/ft/ftcustomcollisions.generated.inc \
            src/ft/ftcustomcollisionregistry.generated.inc src/ft/ftneutralprojectiles.generated.inc \
            src/ft/ftneutralactions.generated.inc src/ft/ftspecialtiming.generated.inc
      - name: Check move behavior and donor data
        run: |
          mkdir -p build
          python3 tools/prepareSharedAnimationTest.py
          gcc -m32 -nostdlib -static -fno-pie -fno-stack-protector -O1 \
            -Iinclude -Isrc -D__sgi -D_LANGUAGE_C -D_MIPS_SZLONG=32 -DREGION_US \
            tools/testCustomMove.c -o build/testCustomMove
          build/testCustomMove
          python3 tools/testNeutralLifecycle.py
          python3 tools/testSpecialTiming.py
          python3 tools/testSuperJump.py
          python3 tools/testDirectSpecials.py
          python3 tools/testRemainingSpecials.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from elfData import read_elf
          from verifyCustomMoveData import verify_sources
          verify_sources(*read_elf(Path('build/testCustomMove'), '<'))
          PY
          python3 tools/testNativeAnimation.py
