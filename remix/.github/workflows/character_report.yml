name: Character Action Coverage Report

permissions:
  contents: write

on:
  push:
    paths:
      - 'extra_characters/**'
      - 'scripts/check_action_coverage.py'
      - '.github/workflows/character_report.yml'

jobs:
  check-action-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure submodules are updated
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          git submodule status
          ls -l
          ls -l smashremix
          ls -l smashremix/src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pipenv
        run: python -m pip install --upgrade pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run action coverage for each character
        run: |
          for d in extra_characters/*; do
            if [ -d "$d" ] && [ -f "$d/main.asm" ]; then
              char_name=$(basename "$d")
              echo "<details><summary>$char_name</summary>" >> $GITHUB_STEP_SUMMARY
              echo '' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo '' >> $GITHUB_STEP_SUMMARY
              pipenv run python scripts/check_action_coverage.py \
                smashremix/src/Action.asm \
                "$d/main.asm" >> $GITHUB_STEP_SUMMARY || echo "Failed to process $char_name" >> $GITHUB_STEP_SUMMARY
              echo '' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo '' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done